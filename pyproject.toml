[project]
name = "rasool"
version = "0.1.0"
description = "Rasool Core — IoT agent platform (EventBus + Services + Drivers)"
requires-python = ">=3.11,<3.14"
readme = "README.md"

dependencies = [
    "httpx>=0.27",
]

[project.scripts]
rasool-digest = "rasool.digest:main"
rasool-live-search = "rasool.live_search:main"

[project.optional-dependencies]
sniff = ["scapy>=2.5"]
translate = ["argostranslate>=1.9"]
feed = ["feedparser>=6.0"]
parse = ["lxml>=5.0", "beautifulsoup4>=4.12"]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["rasool*", "agents*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
